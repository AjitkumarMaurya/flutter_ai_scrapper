name: flutter_ai_scrapper
description: >-
  On-device AI web scraping for Flutter. Parses real HTML with a DOM, harvests
  JSON-LD and OpenGraph for free, and falls back to a local Gemma model or any
  OpenAI/Claude-compatible provider for schema-typed extraction.
version: 2.0.0-dev.1

repository: https://github.com/raghav117/flutter_scrapper
homepage: https://github.com/raghav117/flutter_scrapper
issue_tracker: https://github.com/raghav117/flutter_scrapper/issues

topics:
  - scraping
  - html
  - ai
  - on-device
  - gemma

# Android and iOS only, by decision. Desktop and Web are out of scope for 2.0:
# Web cannot fetch third-party pages at all (CORS), and desktop is deferred
# rather than half-supported. Declaring this here makes pub.dev state it
# plainly instead of letting consumers discover it at runtime.
platforms:
  android:
  ios:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP transport for the fetch stage.
  http: "^1.6.0"

dev_dependencies:
  build_runner: "^2.9.0"
  flutter_lints: "^6.0.0"
  flutter_test:
    sdk: flutter
  mockito: "^5.5.1"

flutter:
  uses-material-design: true
