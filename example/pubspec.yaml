name: example
description: "Demo app for flutter_ai_scrapper."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_ai_scrapper:
    path: ../

  # State management is the app's choice, not the library's — the package
  # itself ships no state-management dependency.
  provider: "^6.1.5"

  cupertino_icons: "^1.0.8"

  # Engines are opt-in for consumers — the library itself does not pick for the consumer.
  # LiteRT-LM is arm64-v8a only; MediaPipe (.task) covers x86_64/armeabi-v7a.
  flutter_gemma: "^1.7.0"
  flutter_gemma_litertlm: "^1.6.1"
  flutter_gemma_mediapipe: "^1.0.5"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: "^6.0.0"

flutter:
  uses-material-design: true
